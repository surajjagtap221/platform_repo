# ==============================================================================
# Argo CD Bootstrap Configuration
# Platform    : Enterprise DevSecOps Platform
# Environment : Development
# Purpose     : Bootstrap Argo CD using Terraform.
#               After bootstrap, Argo CD manages itself and the entire platform.
# ==============================================================================

# ==============================================================================
# CRDs
# ==============================================================================
crds:
  install: true

# ==============================================================================
# Global Configuration
# ==============================================================================
global:
  revisionHistoryLimit: 3

  logging:
    level: info

# ==============================================================================
# Argo CD Configuration
# ==============================================================================
configs:
  params:
    server.insecure: true

  cm:
    timeout.reconciliation: 180s
    admin.enable: true

# ==============================================================================
# API Server
# ==============================================================================
server:
  replicas: 1

  service:
    type: LoadBalancer

  ingress:
    enabled: false

  metrics:
    enabled: true

  resources:
    requests:
      cpu: 250m
      memory: 512Mi

    limits:
      cpu: 500m
      memory: 1Gi

# ==============================================================================
# Repository Server
# ==============================================================================
repoServer:
  replicas: 1

  metrics:
    enabled: true

  resources:
    requests:
      cpu: 250m
      memory: 512Mi

    limits:
      cpu: 500m
      memory: 1Gi

# ==============================================================================
# Application Controller
# ==============================================================================
controller:
  replicas: 1

  metrics:
    enabled: true

  resources:
    requests:
      cpu: 250m
      memory: 512Mi

    limits:
      cpu: 500m
      memory: 1Gi

# ==============================================================================
# ApplicationSet Controller
# ==============================================================================
applicationSet:
  replicas: 1

  metrics:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: 250m
      memory: 512Mi

# ==============================================================================
# Redis
# ==============================================================================
redis:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: 250m
      memory: 512Mi

# ==============================================================================
# High Availability
# ==============================================================================
redis-ha:
  enabled: false

# ==============================================================================
# Authentication
# ==============================================================================
dex:
  enabled: false

# ==============================================================================
# Notifications
# ==============================================================================
notifications:
  enabled: false